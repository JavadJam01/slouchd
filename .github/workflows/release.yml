name: release slouchd desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'release tag name (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: build windows installer
    runs-on: windows-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: determine release tag and version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            $tag = "${{ github.event.inputs.tag_name }}"
            if (-not $tag) { $tag = "v0.2.0" }
          }
          $ver = $tag.TrimStart('v')
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'slouchd-desktop/requirements.txt'

      - name: install python dependencies
        shell: pwsh
        run: |
          cd slouchd-desktop
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: install inno setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: sync version info
        shell: pwsh
        run: |
          cd slouchd-desktop
          python sync_version.py "$env:APP_VERSION"

      - name: build with pyinstaller
        shell: pwsh
        run: |
          cd slouchd-desktop
          pyinstaller --noconfirm --clean slouchd.spec

      - name: compile inno setup installer
        shell: pwsh
        run: |
          cd slouchd-desktop
          $iscc = if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            "ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer/slouchd.iss

      - name: generate checksums
        shell: pwsh
        run: |
          cd slouchd-desktop/dist/installer
          Get-FileHash -Algorithm SHA256 *.exe | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "slouchd ${{ env.RELEASE_TAG }}"
          files: |
            slouchd-desktop/dist/installer/*.exe
            slouchd-desktop/dist/installer/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true

